doctrine:
    dbal:
        default_connection: default
        connections:
            default:
                dbname: db
                server_version: 8.0.31

    orm:
        filters:
            soft_delete:
                class: Doctrine\Bundle\DoctrineBundle\Tests\DependencyInjection\TestFilter
                enabled: true
            myFilter:
                class: Doctrine\Bundle\DoctrineBundle\Tests\DependencyInjection\TestFilter
                enabled: true
                parameters:
                    myParameter: myValue
                    mySecondParameter: mySecondValue
